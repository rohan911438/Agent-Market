databases:
  - name: agentmarket-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: agentmarket-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Wired to the managed Postgres above. apps/api/docker-entrypoint.sh runs
      # `prisma migrate deploy` against it on every boot before serving traffic.
      - key: DATABASE_URL
        fromDatabase:
          name: agentmarket-db
          property: connectionString
      - key: PAYMENT_PROVIDER
        value: algorand-x402
      # `testnet` or `mainnet`. For the Global x402 Challenge set `mainnet`,
      # with X402_USDC_ASSET_ID=31566704 and X402_PAY_TO_ADDRESS a permanent
      # address opted in to that ASA.
      - key: ALGORAND_NETWORK
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: X402_PAY_TO_ADDRESS
        sync: false
      - key: X402_USDC_ASSET_ID
        sync: false
      - key: X402_FEE_PAYER_ADDRESS
        sync: false
      # Challenge attribution + Bazaar discovery. Set X402_CHALLENGE_TAG to
      # `x402-global-challenge` and X402_BAZAAR_DISCOVERY to `true` to compete.
      - key: X402_CHALLENGE_TAG
        sync: false
      - key: X402_BAZAAR_DISCOVERY
        sync: false
      - key: X402_MERCHANT_NAME
        sync: false
      - key: X402_MERCHANT_WEBSITE
        sync: false
      - key: X402_MERCHANT_LOGO
        sync: false
      - key: X402_MERCHANT_CATEGORIES
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WALLET_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
    healthCheckPath: /health
