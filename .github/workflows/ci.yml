name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: neither job below writes to the repo, comments on PRs, or
# uses any token-requiring write action -- both only need to read the code
# they check out. Explicit here rather than relying on the org/repo's default
# GITHUB_TOKEN scope, which may be broader than this workflow needs.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # Scoped to production dependencies and gated at `critical` for now —
      # the full dependency tree (incl. build tooling like vitest/prisma CLI)
      # currently carries known, tracked, non-blocking findings (see
      # docs/SECURITY.md "Known gaps"). Ratchet to --audit-level=high once
      # those are cleared.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check for Prisma schema drift
        working-directory: packages/database
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  dependency-review:
    # Flags newly-introduced vulnerable/incompatible-license dependencies in
    # a PR diff before merge — complements the `npm audit` snapshot above,
    # which only sees the state of the tree as of that push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
